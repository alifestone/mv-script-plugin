# lint_plan.py 的中文詞表（繁體中文）。換語言或換用語習慣：複製這份改內容，再用 --words 指定。
# 沒有出現在檔案裡的鍵，對應的規則會略過（stderr 會提示）；不會自動拿這份補。

# ── 舊規則（legacy 與 full 都用）──────────────────────────
# W1：first_frame 應是靜止畫面，出現這些動作詞給 WARN
motion_words: [正在, 開始, 逐漸, 慢慢, 轉向, 走向, 即將, 接著, 然後, 之後, 滑入, 飛過]
# W2：模糊詞
vague_words: [一些, 某種, 某個, 適當, 適度, 若干, 等等, 之類, 很多, 許多, 幾個, 一點,
              氛圍感, 感覺, 似乎, 大概, 好像, 閃幾下, 連閃]
# W3：「閃三次」這類沒拆成 beat_events 的序列（Python 正規表示式）
seq_re: '(閃|亮|跳)(兩|三|四|五|\d)(次|下)|連(閃|亮)'
# N3：敘事層（story）不該出現的鏡頭用語
story_camera_words: [特寫, 近景, 中景, 遠景, 全身, 推近, 拉遠, 鏡頭, 構圖, 畫面左, 畫面右, 景別]

# ── 新規則（只在 --profile full）──────────────────────────
# V1：景別為 ECU／CU 時，first_frame 要寫明聚焦的身體部位；含下列任一詞即可
focus_parts: [臉, 側臉, 臉頰, 下巴, 眼, 瞳孔, 睫毛, 眉, 鼻, 嘴, 唇, 耳, 手, 手指, 指尖, 掌心, 腳, 腳尖,
              髮, 頸, 肩, 胸口]

# V2：ViMax「不准比喻」，story 與 shots 文字含下列詞給 WARN
metaphor_words: [像, 彷彿, 仿佛, 宛如, 如同, 好似, 猶如, 恍如, 有如, 好比, 似的]
# V2：比對前先從文字移除的複合詞（這些「像」不是比喻）
metaphor_exclude: [影像, 畫像, 圖像, 雕像, 肖像, 人像, 錄像, 成像, 映像, 鏡像, 全像, 想像, 像素, 偶像, 攝像]

# F1：motion.subject 寫到這些外觀變化時，應該有 last_frame
appearance_change: [睜眼, 閉眼, 睜開, 閉上, 表情, 張嘴, 閉嘴, 轉身, 轉頭, 回頭, 抬頭, 低頭, 微笑, 皺眉,
                    站起, 蹲下, 坐下, 倒下]
# F1：比對前先從子句移除的詞（眨眼首尾幀相同，不算外觀變化）
appearance_exclude: [眨眼]

# F2：轉向的動作詞；子句裡出現就視為該主體的朝向會變
turn_words: [轉身, 轉頭, 轉向, 轉正, 回頭, 回身, 迴轉]
# F2：水平行進的動作詞（刻意用雙字詞）
travel_words: [滑入, 滑出, 滑向, 飛入, 飛出, 飛向, 飛過, 走入, 走進, 走出, 走向, 跑向, 跑進, 衝向, 衝出, 衝進,
               躍出, 進入, 離開, 橫越, 繞過, 繞行, 移動, 移到, 前進, 後退, 追上]
# F2：身體部位或附屬物；@id 與動作詞之間出現這些詞，表示轉的是部位（視線、光帶）而不是主體本身
part_words: [視線, 目光, 眼神, 光帶, 光束, 面罩, 頭髮, 髮尾, 手臂, 手掌, 手指]
# F4（不用於 F2）：垂直位移；上升、下降不改變朝向，但擠在不到 1 拍裡仍然太趕
vertical_words: [上升, 下降, 降落, 落下, 墜落, 衝上, 爬上, 跳起, 跳上, 跳下, 踏上, 踩上]

# F3：靜止角色的 first_frame 要寫臉部狀態；每一類都至少要含一個詞（鍵名會出現在訊息裡）
face_state:
  表情: [表情, 神情, 神色, 微笑, 笑, 皺眉, 嚴肅, 平靜, 驚訝, 面無表情, 凝視]
  嘴: [嘴, 唇, 嘴角, 閉口, 抿]
  眼: [眼, 睜眼, 閉眼, 瞳孔, 視線, 目光, 眼神]
# F3：motion.subject 寫這些詞的句子視為「該角色沒有動作」
still_words: [不動, 靜止, 不變, 保持, 維持]
