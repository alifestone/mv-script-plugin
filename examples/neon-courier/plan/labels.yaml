# render_plan.py 的欄位名稱對照：把 glossary.yaml 裡用到的欄位（look 的子欄位、variants 的鍵…）對應成中文。
# 沒有列在這裡的 key 會直接顯示原文。其他兩區（realize、texts）沿用範本的預設值，不另外覆蓋。
fields:
  # 實體本身的欄位
  role: 角色設定
  notes: 備註
  refs: 參考圖
  variants: 版本
  extras: 路人
  # look 的子欄位
  shape: 形狀
  outfit: 服裝
  color: 顏色
  light: 光
  asymmetry: 非對稱外觀
  front: 前面板
  layout: 配置
  floor: 地面
  weather: 天氣
  palette: 色調
  slot: 投信口
  surface: 表面
  motion: 動態
  scope: 照亮範圍
  realize: 做法
  # variants 的鍵
  dark: 熄燈版
  dawn: 天亮版
